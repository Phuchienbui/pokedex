<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokédex</title>
    <meta name="description" content="Browse Pokémon, search by name and view their stats." />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="site-header">
      <img class="site-logo" src="assets/favicon.svg" alt="" width="40" height="40" />
      <h1 class="site-title">Pokédex</h1>
      <form class="search-form" role="search">
        <label class="visually-hidden" for="search-input">Search Pokémon by name</label>
        <input
          class="search-input"
          id="search-input"
          data-id="search-input"
          type="search"
          placeholder="Search by name (at least 3 letters)"
          autocomplete="off"
        />
        <button class="search-button" data-id="search-button" type="submit" disabled>Search</button>
      </form>
    </header>
    <main data-id="content" class="site-content">
      <ul class="pokemon-list"></ul>
      <p class="status-area" role="status" aria-live="polite"></p>
      <button class="load-more-button" data-id="load-more-button" type="button" hidden>
        Load more
      </button>
    </main>
    <footer class="site-footer">
      <p>Data provided by <a href="https://pokeapi.co/">PokéAPI</a>.</p>
    </footer>
  </body>
</html>
